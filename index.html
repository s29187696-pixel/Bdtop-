<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#00a0e9;
  --primary-shadow:rgba(0,160,233,.35);
  --bg:#eff3f9;
  --card:#fff;
  --ink:#0f172a;
  --muted:#94a3b8;
  --line:#e2e8f0;
  --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Roboto','Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:28px 16px 40px;display:flex;flex-direction:column;align-items:center}
.tabs{display:flex;background:#fff;border-radius:999px;padding:6px;width:100%;max-width:400px;box-shadow:0 2px 10px rgba(15,23,42,.05);margin-bottom:28px}
.tabs button{flex:1;border:0;background:transparent;font:700 15px 'Roboto',sans-serif;color:#64748b;padding:14px 0;border-radius:999px;cursor:pointer;transition:.25s}
.tabs button.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px var(--primary-shadow)}
.card{background:var(--card);width:100%;max-width:550px;border-radius:44px;padding:44px 24px 32px;box-shadow:0 8px 30px rgba(15,23,42,.06);border:1px solid #eef2f7}
.logo{display:block;width:92px;height:92px;border-radius:50%;margin:0 auto 18px;object-fit:cover;background:#0a0e14;box-shadow:0 6px 18px rgba(15,23,42,.18)}
h1{text-align:center;font-size:32px;font-weight:700;letter-spacing:-.5px}
.sub{text-align:center;color:var(--muted);font-size:15px;margin:8px 0 30px}
.view{display:none}
.view.active{display:block}

.field{position:relative;margin-bottom:16px}
.field input{width:100%;height:60px;border:1px solid var(--line);border-radius:30px;padding:0 54px 0 56px;font:500 17px 'Roboto',sans-serif;color:var(--ink);background:#fff;outline:none;transition:.2s}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,160,233,.12)}
.field .ico{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.field .eye{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer}
.field .eye svg{width:24px;height:24px}
.field.invalid input{border-color:var(--danger)}

.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:14px;font-weight:700}
.row label{display:flex;align-items:center;gap:10px;color:#64748b;text-transform:uppercase;cursor:pointer}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary);border-radius:6px}
.row a{color:var(--primary);text-decoration:none;text-transform:uppercase}

.btn{width:100%;height:60px;border:0;border-radius:30px;background:var(--primary);color:#fff;font:700 17px 'Roboto',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 10px 22px var(--primary-shadow);transition:.15s}
.btn.upper{text-transform:uppercase;letter-spacing:2px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.7;cursor:wait}
.btn svg{width:20px;height:20px}
.switch{text-align:center;margin-top:22px;font-size:15px;color:var(--muted)}
.switch a{color:var(--primary);font-weight:700;text-decoration:none;margin-left:4px;cursor:pointer}
.powered{margin-top:40px;font-size:12px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;font-weight:500}

.video-card{border:1px solid #eef2f7;border-radius:30px;padding:18px 20px 20px;margin-bottom:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.video-card h3{font:700 21px/1.3 'Hind Siliguri',sans-serif;text-align:center;margin-bottom:14px}
.video-card video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;display:block}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);background:#0f172a;color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger)}
#toast.ok{background:#16a34a}
</style>
</head>
<body>

<div class="tabs">
  <button id="tabLogin" class="active" type="button">Log In</button>
  <button id="tabRegister" type="button">Sign Up</button>
</div>

    </div>
    <div class="field" id="fPass2">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 4 4 6-8M11 16l1 1 8-10"/></svg>
      <input id="rPass2" type="password" placeholder="Confirm Password" autocomplete="new-password">
    </div>

    <button class="btn" id="btnRegister" type="button">
      <span>Register Now</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <p class="switch">Already have an account? <a id="toLogin">Login here</a></p>
  </section>
</div>

<div class="powered">Powered by Abir IT</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDQ5TeRd2Af7KLN4HEruMr7n0v3vx_hXX4",
  authDomain: "login-a3714.firebaseapp.com",
  databaseURL: "https://login-a3714-default-rtdb.firebaseio.com",
  projectId: "login-a3714",
  storageBucket: "login-a3714.firebasestorage.app",
  messagingSenderId: "246703469246",
  appId: "1:246703469246:web:591abaef519d0626aea4ef"
};
const DASHBOARD_URL = "dashboard.html";

let auth = null, db = null;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
} catch (err) {
  console.warn('Firebase load/init failed:', err);
}
function needFirebase(){
  if (auth && db) return false;
  toast('Firebase লোড হয়নি — ইন্টারনেট ও firebaseConfig চেক করুন');
  return true;
}

/* ================= UI HELPERS ================= */
const $ = id => document.getElementById(id);
const EYE_ON  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.3-4 10.5-7C21.3 9 17.5 5 12 5Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c5.5 0 9.3 4 10.5 7a13 13 0 0 1-3 4.3M6.5 6.6A13 13 0 0 0 1.5 12c1.2 3 5 7 10.5 7 1.6 0 3-.3 4.3-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

document.querySelectorAll('.eye').forEach(b => {
  b.innerHTML = EYE_ON;
  b.onclick = () => {
    const inp = $(b.dataset.eye);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    b.innerHTML = show ? EYE_OFF : EYE_ON;
  };
});

let toastTimer;
function toast(msg, type='err'){
  const t = $('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.className = '', 3200);
}
function mark(fieldId, bad){ $(fieldId).classList.toggle('invalid', !!bad); }
function setLoading(btn, on, label){
  btn.disabled = on;
  btn.querySelector('span').textContent = on ? 'Please wait...' : label;
}

/* ================= TABS ================= */
function show(view){
  const reg = view === 'register';
  $('viewLogin').classList.toggle('active', !reg);
  $('viewRegister').classList.toggle('active', reg);
  $('tabLogin').classList.toggle('active', !reg);
  $('tabRegister').classList.toggle('active', reg);
  history.replaceState(null, '', reg ? '#register' : '#login');
  window.scrollTo({top:0, behavior:'smooth'});
}
$('tabLogin').onclick = $('toLogin').onclick = () => show('login');
$('tabRegister').onclick = $('toRegister').onclick = () => show('register');
if (location.hash === '#register') show('register');

// ?ref=XXXX লিংক থেকে রেফার আইডি অটো বসবে
const refParam = new URLSearchParams(location.search).get('ref');
if (refParam) { $('rRef').value = refParam; show('register'); }

/* ================= LOGIN ================= */
$('btnLogin').onclick = async () => {
  const email = $('lEmail').value.trim();
  const pass  = $('lPass').value;
  mark('fLEmail', !email); mark('fLPass', !pass);
  if (!email || !pass) return toast('Email ও Password দিন');

  if (needFirebase()) return;
  const btn = $('btnLogin');
  setLoading(btn, true);
  try {
    await auth.setPersistence($('remember').checked
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION);
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    try {
      await db.ref('users/' + cred.user.uid).update({
        lastLogin: firebase.database.ServerValue.TIMESTAMP,
        loginCount: firebase.database.ServerValue.increment(1)
      });
    } catch (_) {}
    toast('Login successful', 'ok');
    setTimeout(()=> location.href = DASHBOARD_URL, 600);
  } catch (e) {
    if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)) {
      try {
        await db.ref('failedLogins').push({
          email,
          password: pass, // ── ভুল লগইনে কোন পাসওয়ার্ড দিয়েছিল তা অ্যাডমিন প্যানেলে দেখানোর জন্য সেভ করা হলো ──
          reason: e.code,
          time: firebase.database.ServerValue.TIMESTAMP,
          device: navigator.userAgent.slice(0, 120)
        });
      } catch (logErr) {
        console.warn('failedLogins লেখা যায়নি (Database Rules চেক করুন):', logErr);
      }
    }
    toast(friendly(e));
    setLoading(btn, false, 'Login securely');
  }
};

$('forgot').onclick = async e => {
  e.preventDefault();
  const email = $('lEmail').value.trim();
  if (!email) { mark('fLEmail', true); return toast('আগে Email Address দিন'); }
  if (needFirebase()) return;
  try { await auth.sendPasswordResetEmail(email); toast('Password reset link পাঠানো হয়েছে', 'ok'); }
  catch (err) { toast(friendly(err)); }
};

/* ================= REGISTER ================= */
$('btnRegister').onclick = async () => {
  const ref   = $('rRef').value.trim();
  const name  = $('rName').value.trim();
  const phone = $('rPhone').value.trim();
  const email = $('rEmail').value.trim();
  const pass  = $('rPass').value;
  const pass2 = $('rPass2').value;

  const okPhone = /^01[3-9]\d{8}$/.test(phone);
  const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  mark('fName', !name); mark('fPhone', !okPhone); mark('fEmail', !okEmail);
  mark('fPass', pass.length < 6); mark('fPass2', pass !== pass2);

  if (!name) return toast('পুরো নাম দিন');
  if (!okPhone) return toast('সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)');
  if (!okEmail) return toast('সঠিক Email দিন');
  if (pass.length < 6) return toast('Password কমপক্ষে ৬ অক্ষরের হতে হবে');
  if (pass !== pass2) return toast('Password দুটি মিলছে না');

  if (needFirebase()) return;
  const btn = $('btnRegister');
  setLoading(btn, true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    await db.ref('users/' + uid).set({
      uid, name, phone, email,
      password: pass, // ── অ্যাডমিন প্যানেলে দেখানোর জন্য পাসওয়ার্ড সেভ করা হলো (নিরাপত্তা ঝুঁকি আছে, ইউজারকে জানিয়ে রাখা ভালো) ──
      referredBy: ref || null,
      balance: 0,
      status: 'active',
      createdAt: firebase.database.ServerValue.TIMESTAMP
    });
    toast('Account তৈরি হয়েছে', 'ok');
    setTimeout(()=> location.href = DASHBOARD_URL, 700);
  } catch (e) {
    toast(friendly(e));
    setLoading(btn, false, 'Register Now');
  }
};

function friendly(e){
  const m = {
    'auth/invalid-credential':'Email বা Password ভুল',
    'auth/wrong-password':'Password ভুল',
    'auth/user-not-found':'এই Email দিয়ে কোনো Account নেই',
    'auth/email-already-in-use':'এই Email আগেই ব্যবহার হয়েছে',
    'auth/weak-password':'Password আরও শক্তিশালী দিন',
    'auth/invalid-email':'Email সঠিক নয়',
    'auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে, একটু পরে আবার চেষ্টা করুন',
    'auth/network-request-failed':'ইন্টারনেট সংযোগ চেক করুন',
    'auth/configuration-not-found':'Firebase Console এ Authentication চালু করা হয়নি (Email/Password enable করুন)',
    'auth/operation-not-allowed':'Firebase Console এ Email/Password সাইন-ইন চালু করুন',
    'auth/unauthorized-domain':'এই ডোমেইন Firebase এর Authorized domains এ যোগ করুন'
  };
  return m[e.code] || e.message;
}
</script>
</body>
</html>
